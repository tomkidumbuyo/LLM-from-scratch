[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-from-scratch"
version = "0.1.0"
description = "A small GPT implementation with training and text generation scripts."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0",
    "tiktoken>=0.5",
    "torch>=2.0",
]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["finetuning*", "generation*", "pretraining*"]
